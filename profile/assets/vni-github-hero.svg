<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">VirtuallyNoIdea — systems, signals and things made useful</title>
  <desc id="desc">A dark editorial banner for Benjamin Johnson's independent workshop. A sequence of signal, question, evidence and useful forms an inspectable path beside the VirtuallyNoIdea name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110F"/>
      <stop offset="0.58" stop-color="#10201C"/>
      <stop offset="1" stop-color="#153B35"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8F34A"/>
      <stop offset="1" stop-color="#D9FF8C"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B8F34A" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="18" fill="url(#background)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <path d="M0 312C246 253 384 351 608 299C816 251 982 131 1200 164V380H0Z" fill="#B8F34A" opacity="0.035"/>
  <path d="M0 317C246 258 384 356 608 304C816 256 982 136 1200 169" fill="none" stroke="#B8F34A" stroke-opacity="0.18" stroke-width="2"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="58" y="52" width="78" height="78" rx="16" fill="#B8F34A"/>
    <text x="97" y="100" text-anchor="middle" fill="#07110F" font-size="25" font-weight="850" letter-spacing="-1">VNI</text>

    <text x="160" y="75" fill="#9AABA4" font-size="14" font-weight="650" letter-spacing="2.4">BENJAMIN JOHNSON / INDEPENDENT WORKSHOP</text>
    <text x="58" y="207" fill="#FFFEF7" font-size="65" font-weight="780" letter-spacing="-2.8">VIRTUALLY NO IDEA</text>
    <rect x="58" y="231" width="615" height="3" rx="1.5" fill="url(#lime)"/>
    <text x="58" y="270" fill="#B8F34A" font-size="17" font-weight="700" letter-spacing="3.3">SYSTEMS / SIGNALS / THINGS MADE USEFUL</text>
    <text x="58" y="329" fill="#E3E7DB" font-size="16" font-weight="520" letter-spacing="0.3">Strategy that survives contact with the real system.</text>

    <g>
      <path d="M856 82V129M856 169V216M856 256V303" fill="none" stroke="#B8F34A" stroke-opacity="0.44" stroke-width="2"/>
      <circle cx="856" cy="105" r="4" fill="#B8F34A"/>
      <circle cx="856" cy="192" r="4" fill="#B8F34A"/>
      <circle cx="856" cy="279" r="4" fill="#B8F34A"/>

      <g transform="translate(786 48)">
        <rect width="330" height="58" rx="12" fill="#142722" stroke="#51615B"/>
        <text x="22" y="25" fill="#9AABA4" font-size="11" font-weight="700" letter-spacing="1.8">01 / SIGNAL</text>
        <text x="22" y="45" fill="#FFFEF7" font-size="15" font-weight="650">Notice what might matter</text>
      </g>
      <g transform="translate(786 135)">
        <rect width="330" height="58" rx="12" fill="#142722" stroke="#51615B"/>
        <text x="22" y="25" fill="#9AABA4" font-size="11" font-weight="700" letter-spacing="1.8">02 / QUESTION</text>
        <text x="22" y="45" fill="#FFFEF7" font-size="15" font-weight="650">Make the uncertainty explicit</text>
      </g>
      <g transform="translate(786 222)">
        <rect width="330" height="58" rx="12" fill="#142722" stroke="#51615B"/>
        <text x="22" y="25" fill="#9AABA4" font-size="11" font-weight="700" letter-spacing="1.8">03 / EVIDENCE</text>
        <text x="22" y="45" fill="#FFFEF7" font-size="15" font-weight="650">Build enough to challenge it</text>
      </g>
      <g transform="translate(786 309)">
        <rect width="330" height="44" rx="12" fill="#B8F34A"/>
        <text x="22" y="28" fill="#07110F" font-size="13" font-weight="800" letter-spacing="1.5">04 / KEEP WHAT IS USEFUL</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="#51615B" stroke-opacity="0.65" stroke-width="2"/>
</svg>
